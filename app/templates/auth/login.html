{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <p class="eyebrow">Secure Access</p>
  <h1>Sign in</h1>
  <p class="lede">Only authorized users can access confidential case content, attachments, and reporting tools.</p>
  <form class="stack-form" method="post">
    {{ form.hidden_tag() }}
    <label>
      <span>{{ form.identifier.label.text }}</span>
      {{ form.identifier(placeholder="admin or name@agency.gov") }}
      {% for error in form.identifier.errors %}
      <small class="warning-copy">{{ error }}</small>
      {% endfor %}
    </label>
    <label>
      <span>{{ form.password.label.text }}</span>
      {{ form.password(placeholder="Password") }}
      {% for error in form.password.errors %}
      <small class="warning-copy">{{ error }}</small>
      {% endfor %}
    </label>
    <label class="inline-check">
      {{ form.remember() }}
      <span>{{ form.remember.label.text }}</span>
    </label>
    {{ form.submit(class_="primary-button") }}
  </form>
</section>
{% endblock %}
